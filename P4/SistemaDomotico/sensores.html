<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sensores - Simulación</title>
</head>
<body>
  <h2>Simular sensores</h2>

  <form id="formSensores">
    <label for="temperatura">Temperatura (°C):</label>
    <input type="number" id="temperatura" step="0.1"><br><br>

    <label for="luminosidad">Luminosidad:</label>
    <input type="number" id="luminosidad" step="1"><br><br>

    <button type="submit">Enviar medidas</button>
  </form>

  <!-- Carga la librería de Socket.io y el archivo separado de JavaScript -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="sensores.js"></script>
</body>
</html>
