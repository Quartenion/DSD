<!DOCTYPE html>
<html>
<head>
  <title>Sensores - Simulación</title>
</head>
<body>
  <h2>Simular sensores</h2>

  <form id="formSensores">
    <label for="temperatura">Temperatura (°C):</label>
    <input type="number" id="temperatura"><br><br>

    <label for="luminosidad">Luminosidad:</label>
    <input type="number" id="luminosidad"><br><br>

    <label for="humedad">Humedad:</label>
    <input type="number" id="humedad"><br><br>

    <label>
      Lluvia:
      <input type="checkbox" id="lluvia"><br><br>
    </label>


    <button type="submit">Enviar medidas</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sensores.js"></script>
</body>
</html>
