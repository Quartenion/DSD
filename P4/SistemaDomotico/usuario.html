<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Usuario - Sistema Domótico</title>

  <style>
    .alerta {
      color: red;
      transition: opacity 1s ease-out;
      opacity: 1;
    }

    .alerta.fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <h2>Estado del sistema</h2>

  <div>
    <strong>Temperatura:</strong> <span id="tempValor">--</span> °C<br>
    <strong>Luminosidad:</strong> <span id="luzValor">--</span><br>
    <strong>Humedad:</strong> <span id="humedadValor">--</span>%<br>
    <strong>Lluvia:</strong> <span id="lluviaValor">--</span><br>
  </div>

  <h3>Actuadores</h3>
  <div>
    <strong>Persiana:</strong> <span id="persianaEstado">--</span><br>
    <img id="persianaIcono" src="img/persiana_cerrada.png" alt="Icono Persiana" width="100"><br><br>

    <strong>Aire Acondicionado:</strong> <span id="aireEstado">--</span><br>
    <img id="aireIcono" src="img/aire_apagado.png" alt="Icono Aire A/C" width="100"><br><br>

    <strong>Calefacción:</strong> <span id="calorEstado">--</span><br>
    <img id="calorIcono" src="img/calor_apagado.png" alt="Icono Calefacción" width="100"><br><br>

    <strong>Ventana:</strong> <span id="ventanaEstado">--</span><br>
    <img id="ventanaIcono" src="img/ventana_cerrada.png" alt="Icono Ventana" width="100"><br><br>

    <strong>Riegue:</strong> <span id="riegueEstado">--</span><br>
    <img id="riegueIcono" src="img/riegue_apagado.png" alt="Icono Riegue" width="100">
  </div>


  <h3>Control manual</h3>
  <button onclick="controlar('persiana', 'abierta')">Abrir persiana</button>
  <button onclick="controlar('persiana', 'cerrada')">Cerrar persiana</button><br><br>
  <button onclick="controlar('aire', 'encendido')">Encender A/C</button>
  <button onclick="controlar('aire', 'apagado')">Apagar A/C</button><br><br>
  <button onclick="controlar('calor', 'encendida')">Encender calefacción</button>
  <button onclick="controlar('calor', 'apagada')">Apagar calefacción</button><br><br>
  <button onclick="controlar('ventana', 'abierta')">Abrir ventana</button>
  <button onclick="controlar('ventana', 'cerrada')">Cerrar ventana</button><br><br>
  <button onclick="controlar('riegue', 'encendido')">Encender riegue</button>
  <button onclick="controlar('riegue', 'apagado')">Apagar riegue</button>

  <h3>Notificaciones</h3>
  <div id="notificaciones"></div>

  <h3>Historial de eventos</h3>
  <ul id="historial"></ul>

  <!-- Carga de scripts externos -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="usuario.js"></script>
</body>
</html>
